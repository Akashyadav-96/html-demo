<!DOCTYPE html>
<html>
<head>
  <title>Simple Product Page</title>
  <style>
    body {
      font-family:Georgia, 'Times New Roman', Times, serif;
      background: aquamarine;
      padding: 0%;
      margin: 0%;
    }
    
    .card {
      max-width: 400px;
      margin: auto;
      background: #fff;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .price {
      color:red;
      font-weight: bold;
    }

    .old-price {
      text-decoration: line-through;
      color: gray;
    }

    button {
      width: 100%;
      padding: 10px;
      background: blue;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1 style="text-align:center;">ShopEasy</h1>

  <div class="card">
    <img src="https://m.media-amazon.com/images/I/51Wrt+lXZZL._AC_UL480_FMwebp_QL65_.jpg" alt="Wooden Pen Stand">
    
    <h2>Woodhouse Wooden Pen Stand</h2>
    
    <p>High-quality product. Available in multiple colors.</p>
    
    <p>
      <span class="price">₹699</span>
      <span class="old-price">₹1,099</span>
    </p>

    <button>Add to Cart</button>
  </div>

</body>
</html>
